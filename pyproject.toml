[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-reviewer"
version = "0.1.0"
description = "LLM-based code reviewer for Python diffs, with structured output and a hallucination filter."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "unidiff>=0.7",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reviewer = "reviewer.cli:main"

[tool.setuptools]
packages = ["reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
